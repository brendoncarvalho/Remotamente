name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  Solution_Name: Remotely.sln

jobs:
  build-test-linux:
    name: Build, test and audit (Linux)
    runs-on: ubuntu-latest
    env:
      # Lets Linux build the net10.0-windows projects (compile only).
      EnableWindowsTargeting: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore $Solution_Name

      - name: Build
        run: dotnet build $Solution_Name --configuration Release --no-restore

      - name: Test (Shared, Server)
        run: |
          dotnet test Tests/Shared.Tests --configuration Release --no-build
          dotnet test Tests/Server.Tests --configuration Release --no-build

      - name: Fail on vulnerable packages
        run: |
          dotnet list $Solution_Name package --vulnerable --include-transitive 2>&1 | tee vulnerabilities.txt
          if grep -q "has the following vulnerable packages" vulnerabilities.txt; then
            echo "::error::Vulnerable NuGet packages found (see log)."
            exit 1
          fi

  build-test-windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore $env:Solution_Name

      - name: Build
        run: dotnet build $env:Solution_Name --configuration Release --no-restore

      - name: Test (all projects)
        run: dotnet test $env:Solution_Name --configuration Release --no-build

  docker:
    name: Server image smoke test
    runs-on: ubuntu-latest
    needs: build-test-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish server
        run: >
          dotnet publish Server/Server.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --output Server/bin/publish

      - name: Build image
        run: docker build -f Server/Dockerfile -t remotamente-server:ci .

      - name: Run and check health
        run: |
          docker run -d --name srv \
            -e ASPNETCORE_HTTP_PORTS=5000 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            remotamente-server:ci
          # /api/healthcheck only answers requests from the machine itself
          # (LocalOnlyFilter), so call it from inside the container, like the
          # image's own HEALTHCHECK does.
          for i in $(seq 1 30); do
            if docker exec srv curl -fsS http://localhost:5000/api/healthcheck; then
              echo; echo "Healthy after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server did not become healthy."
          docker logs srv
          exit 1
